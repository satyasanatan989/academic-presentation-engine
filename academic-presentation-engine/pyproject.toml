[project]
name = "academic-presentation-engine"
version = "1.0.0"
description = "Integrated Academic Research-to-Presentation System (DeerFlow + ECC + PPT Master)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "python-pptx>=1.0.0",
    "pywin32>=308",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "pillow>=11.0.0",
    "xlsxwriter>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
